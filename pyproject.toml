[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mddm-document-merger"
version = "1.0.1"
description = "多部门文档类自动合并软件系统"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lxml>=4.9.0",
    "Pillow>=9.0.0",
]

[project.scripts]
mddm-merge = "mddm.run_merge:main"
mddm-headings = "mddm.process_headings:main"
mddm-formulas = "mddm.run_convert_formulas:main"

[project.gui-scripts]
mddm-gui = "mddm.merge_gui:main"

[tool.setuptools]
packages = ["mddm"]
include-package-data = true

[tool.setuptools.package-data]
mddm = ["resources/*.XSL", "resources/*.xsl", "resources/*.rb"]
